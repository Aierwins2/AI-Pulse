version: '3.8'

services:
  # 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: aipulse-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./data/aipulse.db}
      - DATA_RETENTION_DAYS=${DATA_RETENTION_DAYS:-7}
      - CRAWLER_SCHEDULE_HOUR=${CRAWLER_SCHEDULE_HOUR:-9}
      - CRAWLER_SCHEDULE_MINUTE=${CRAWLER_SCHEDULE_MINUTE:-0}
      - AI_MODEL=${AI_MODEL:-qwen-plus}
    volumes:
      - ./data:/app/data  # 持久化数据库
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 前端服务
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # 前端通过 nginx 反向代理访问 API，使用相对路径
        - VITE_API_URL=${VITE_API_URL:-}
    container_name: aipulse-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: aipulse-network
